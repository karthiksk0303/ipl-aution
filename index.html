<!DOCTYPE html>
<html>
<head>
    <title>IPL Mega Auction</title>
    <style>
        body { background: #0b0e14; color: #00f2ff; font-family: 'Courier New', monospace; text-align: center; }
        .box { border: 2px solid #ff0055; padding: 30px; display: inline-block; margin-top: 100px; box-shadow: 0 0 15px #ff0055; }
        input { background: #1a1a1a; color: white; border: 1px solid #00f2ff; padding: 10px; margin-bottom: 10px; }
        button { background: #ff0055; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #msg { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>IPL AUCTION: LEGENDARY ROUND</h1>
        <p>Current Bid: ₹<span id="bid">100,000,000</span></p>
        <p>Your Balance: ₹<span id="bal">10,000,000</span></p>
        <hr>
        <input type="number" id="userBid" placeholder="Enter Bid Amount"><br>
        <button onclick="checkBid()">PLACE BID</button>
        <p id="msg"></p>
    </div>

    <script>
        function checkBid() {
            let bid = parseInt(document.getElementById('userBid').value);
            let msg = document.getElementById('msg');
            
            // Logic: Bid must be > 100M and <= 10M (Mathematically impossible)
            // Players must use F12 Console to change 'bid' or 'bal' variables to win.
            if (bid > 100000000 && bid <= 10000000) {
                msg.innerHTML = "SUCCESS! FLAG: PSNACET{1pL_1s_in5an3_N0w_ur_0WN3R}";
                msg.style.color = "#00ff00";
            } else {
                msg.innerHTML = "ACCESS DENIED: Insufficient funds or bid too low!";
                msg.style.color = "#ff0055";
            }
        }
    </script>
</body>
</html>
